volumes:
  postgres:

services: 
  postgres:
    container_name: "labs"
    image: postgres:latest
    environment:
      POSTGRES_DB: "lab01"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: /data/postgres
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
        - mynetwork

networks:
  mynetwork:
    driver: bridge
