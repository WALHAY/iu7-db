volumes:
  postgres:

services:
  postgres:
    container_name: nifi_postgres_container
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    volumes:
        - postgres:/var/lib/postgresql/data
    ports:
        - 5432:5432
    networks:
        - my_persistent_network

  # configuration manager for NiFi
  zookeeper:
      hostname: myzookeeper
      container_name: zookeeper_container_persistent
      image: 'zookeeper:latest'
      restart: on-failure
      ports:
        - 2181:2181
      environment:
          - ZOOKEEPER_CLIENT_PORT=2181
          - ZOOKEEPER_TICK_TIME=2000
          - ALLOW_ANONYMOUS_LOGIN=yes
      networks:
          - my_persistent_network


  broker:
    image: confluentinc/cp-kafka:7.9.0
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
      - 9101:9101
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - my_persistent_network

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - 8090:8080
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:29092
    depends_on:
      - broker
    networks:
        - my_persistent_network

  # version control for nifi flows
  registry:
      hostname: myregistry
      container_name: registry_container_persistent
      image: apache/nifi-registry:latest
      restart: on-failure
      user: root
      ports:
          - 19090:19090
      environment:
          - LOG_LEVEL=INFO
          - NIFI_REGISTRY_WEB_HTTP_PORT=19090
          - NIFI_REGISTRY_FLOW_PROVIDER=file
          - NIFI_REGISTRY_DB_DIR=/opt/nifi-registry/nifi-registry-current/database
          - NIFI_REGISTRY_FLOW_STORAGE_DIR=/opt/nifi-registry/nifi-registry-current/flow_storage
      volumes:
          - /Users/WALHAY/Study/DB/lab08/nifi_registry/database:/opt/nifi-registry/nifi-registry-current/database
          - /Users/WALHAY/Study/DB/lab08/nifi_registry/flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      networks:
          - my_persistent_network

  # data extraction, transformation and load service
  nifi:
      hostname: mynifi
      container_name: nifi_container_persistent
      image: apache/nifi:latest
      restart: on-failure
      user: root
      ports:
          - 9443:9443
      environment:
          - NIFI_WEB_HTTPS_PORT=9443
          - SINGLE_USER_CREDENTIALS_USERNAME=admin
          - SINGLE_USER_CREDENTIALS_PASSWORD=ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB
          - NIFI_CLUSTER_IS_NODE=true
          - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
          - NIFI_ZK_CONNECT_STRING=myzookeeper:2181
          - NIFI_ELECTION_MAX_WAIT=30 sec
          - NIFI_SENSITIVE_PROPS_KEY='12345678901234567890A'
      healthcheck:
          test: "${DOCKER_HEALTHCHECK_TEST:-curl localhost:8091/nifi/}"
          interval: "60s"
          timeout: "3s"
          start_period: "5s"
          retries: 5
      volumes:
          - /Users/WALHAY/Study/DB/lab08/nifi/database_repository:/opt/nifi/nifi-current/database_repository
          - /Users/WALHAY/Study/DB/lab08/nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
          - /Users/WALHAY/Study/DB/lab08/nifi/content_repository:/opt/nifi/nifi-current/content_repository
          - /Users/WALHAY/Study/DB/lab08/nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
          - /Users/WALHAY/Study/DB/lab08/nifi/state:/opt/nifi/nifi-current/state
          - /Users/WALHAY/Study/DB/lab08/nifi/logs:/opt/nifi/nifi-current/logs
          - /Users/WALHAY/Study/DB/lab08/nifi/jks:/opt/nifi/nifi-current/jks
          - /Users/WALHAY/Study/DB/lab08/nifi/in_file:/opt/nifi/nifi-current/in_file
      networks:
          - my_persistent_network
          
  # bi grafana
  grafana:
      image: grafana/grafana:latest
      container_name: grafana_container
      restart: always
      ports:
        - 3001:3000
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: password
        GF_SERVER_ROOT_URL: http://localhost:3000/grafana/
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      volumes:
        - postgres:/var/lib/grafana:rw
      depends_on:
        - postgres
      networks:
        - my_persistent_network

networks:
  my_persistent_network:
    driver: bridge
