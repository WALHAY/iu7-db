volumes:
  postgres:

services: 
  postgres:
    container_name: "labs"
    image: postgres:14
    environment:
      POSTGRES_DB: "lab01"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: /data/postgres
    volumes:
      - /Users/walhay/Study/DB/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
        - mynetwork

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
networks:
  mynetwork:
    driver: bridge
